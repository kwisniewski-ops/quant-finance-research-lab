name: deploy-website

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "scripts/build_sitemap.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history: sitemap lastmod values come from each page's last commit
      # date, which a shallow clone cannot see.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Generate sitemap
        run: python3 scripts/build_sitemap.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/frontend
      - id: deployment
        uses: actions/deploy-pages@v4
