name: deploy-website

# The lab is published at https://kylewisniewski.com/lab, served from the main
# site's repository, which vendors app/frontend via its scripts/sync-lab.mjs.
# This workflow keeps lab.kylewisniewski.com serving during the migration:
# every page here declares the new location canonical, so search engines
# consolidate before DNS moves. Retire this workflow once the subdomain is
# redirected at Vercel and GitHub Pages is switched off.

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/frontend
      - id: deployment
        uses: actions/deploy-pages@v4
